<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Nébula</title>
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <span class="logo">◓</span>
      <div>
        <h1>Nébula</h1>
        <p class="tag">Anti-Fingerprint Shield</p>
      </div>
    </div>
    <label class="switch" title="Activar / desactivar">
      <input type="checkbox" id="master" />
      <span class="slider"></span>
    </label>
  </header>

  <section class="card" id="siteCard">
    <div class="row">
      <span class="label">Este sitio</span>
      <span class="host" id="host">—</span>
    </div>
    <label class="checkrow">
      <input type="checkbox" id="siteAllow" />
      <span>Desactivar Nébula en este sitio (lista blanca)</span>
    </label>
    <button class="ghost" id="verify">🔍 Verificar en esta página</button>
    <p class="verify-result" id="verifyResult"></p>
  </section>

  <section class="card">
    <div class="row">
      <span class="label">Modo</span>
      <select id="mode">
        <option value="per-session">Aleatorio por sesión</option>
        <option value="per-site">Aleatorio por sitio</option>
        <option value="blend">Mimetizar (preset)</option>
        <option value="custom">Perfil personalizado</option>
      </select>
    </div>
    <div class="row" id="poolRow">
      <span class="label">Aleatorizar entre</span>
      <select id="pool">
        <option value="desktop">Escritorio (Win/Mac/Linux)</option>
        <option value="mobile">Móvil (Android/iOS)</option>
        <option value="all">Todos</option>
      </select>
    </div>
    <div class="row" id="regionRow">
      <span class="label">Región</span>
      <select id="region">
        <option value="americas">América</option>
        <option value="europe">Europa</option>
        <option value="any">Cualquiera</option>
      </select>
    </div>
    <div class="row" id="presetRow">
      <span class="label">Dispositivo</span>
      <select id="preset"></select>
    </div>
    <p class="hint-sm" id="presetHint">Este es el dispositivo que verán las webs.</p>
    <div class="row">
      <span class="label">Zona horaria</span>
      <select id="timezoneSource">
        <option value="ip">Según mi IP</option>
        <option value="region">Aleatoria</option>
      </select>
    </div>
    <p class="hint-sm" id="geoStatus"></p>
    <button class="ghost" id="regen">↻ Generar nueva identidad</button>
    <button class="primary" id="newProfile">🆕 Crear perfil nuevo y limpio</button>
  </section>

  <section class="card identity">
    <h2>Identidad activa</h2>
    <dl>
      <dt>Navegador</dt><dd id="idUA">—</dd>
      <dt>Plataforma</dt><dd id="idPlatform">—</dd>
      <dt>Pantalla</dt><dd id="idScreen">—</dd>
      <dt>Zona horaria</dt><dd id="idTZ">—</dd>
      <dt>GPU (WebGL)</dt><dd id="idGPU">—</dd>
      <dt>Núcleos / RAM</dt><dd id="idHW">—</dd>
      <dt>Idioma</dt><dd id="idLang">—</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Protecciones</h2>
    <div class="grid" id="toggles"></div>
  </section>

  <footer class="ftr">
    <button class="link" id="openOptions">Ajustes avanzados</button>
    <a class="link" id="testLink" href="https://coveryourtracks.eff.org/" target="_blank" rel="noopener">Probar huella ↗</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
