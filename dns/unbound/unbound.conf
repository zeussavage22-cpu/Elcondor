# Unbound: resolver recursivo propio.
# No reenvía tus consultas a Google/Cloudflare/ISP: pregunta directo a los
# servidores raíz y autoritativos, así nadie más ve tu historial completo.
server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Solo acepta consultas de la red interna de Docker (AdGuard Home).
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.0.0/24 allow

    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    logfile: ""
    use-syslog: no
    verbosity: 0
    log-queries: no

    # ---- Privacidad ----
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes          # solo revela lo mínimo a cada servidor
    aggressive-nsec: yes
    minimal-responses: yes
    use-caps-for-id: no
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # ---- Seguridad ----
    auto-trust-anchor-file: "/var/lib/unbound/root.key"   # DNSSEC
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: yes
    unwanted-reply-threshold: 10000000

    # ---- Velocidad ----
    num-threads: 2
    so-reuseport: yes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    key-cache-size: 32m
    neg-cache-size: 8m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes                    # renueva dominios populares antes de expirar
    prefetch-key: yes
    serve-expired: yes               # responde al instante con caché vieja mientras refresca
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    edns-buffer-size: 1232
    so-rcvbuf: 1m
    infra-cache-numhosts: 10000
    outgoing-range: 8192
    num-queries-per-thread: 4096
